name: PetStore Smoke API Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  smoke-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t petstore-framework .

      - name: Create Report Directory
        run: mkdir -p reports

      - name: Execute Smoke Tests Inside Docker
        run: |
          docker run --rm \
          -e ENV=qa \
          -e GROUP="-Dgroups=smoke" \
          -v ${{ github.workspace }}/reports:/app/target/site/allure-maven-plugin \
          petstore-framework

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-allure-report
          path: reports